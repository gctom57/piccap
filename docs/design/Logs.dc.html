<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PicCap — Logs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E12}
a{color:#F2F3F5}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; display: flex; overflow: hidden; background: #0C0E12; color: #F2F3F5; font-family: 'Sora', sans-serif">

<nav aria-label="Main navigation" style="width: 320px; height: 1080px; box-sizing: border-box; flex-shrink: 0; display: flex; flex-direction: column; gap: 44px; padding: 52px 24px 44px 24px; background: #101319; border-right: 1px solid #1B2029">
  <div style="display: flex; align-items: center; gap: 16px; padding: 0 16px">
    <div style="width: 56px; height: 56px; border-radius: 16px; background: #1A1405; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 0 0 1px #3A2D10, 0 0 24px {{glow}}">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1">PicCap</div>
      <div style="font-size: 16px; color: #8A93A1; font-family: 'JetBrains Mono', monospace">v0.5.3 · Hyperion</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 18px; height: 76px; padding: 0 20px; border-radius: 18px; color: #A6ADB9; font-size: 26px; font-weight: 600; text-decoration: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>
      <span>Status</span>
    </a>
    <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 18px; height: 76px; padding: 0 20px; border-radius: 18px; color: #A6ADB9; font-size: 26px; font-weight: 600; text-decoration: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="15" cy="7" r="2.5" fill="#101319"></circle><circle cx="8" cy="12" r="2.5" fill="#101319"></circle><circle cx="12" cy="17" r="2.5" fill="#101319"></circle></svg>
      <span>Settings</span>
    </a>
    <a href="Logs.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 18px; height: 76px; padding: 0 20px; border-radius: 18px; background: #1B2130; color: #F2F3F5; font-size: 26px; font-weight: 700; text-decoration: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 9l3 3-3 3M12 15h5"></path></svg>
      <span>Logs</span>
    </a>
    <a href="#about" style="display: flex; align-items: center; gap: 18px; height: 76px; padding: 0 20px; border-radius: 18px; color: #A6ADB9; font-size: 26px; font-weight: 600; text-decoration: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
      <span>About</span>
    </a>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 0 16px">
    <div style="font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: #6F7886; font-weight: 700">Theme</div>
    <div style="display: flex; gap: 14px">
      <button aria-label="Midnight theme, selected" style="width: 48px; height: 48px; border-radius: 24px; background: #0C0E12; border: 3px solid {{accent}}; padding: 0; cursor: pointer"></button>
      <button aria-label="Graphite theme" style="width: 48px; height: 48px; border-radius: 24px; background: #23262B; border: 3px solid #3A3F47; padding: 0; cursor: pointer"></button>
      <button aria-label="Pure black theme" style="width: 48px; height: 48px; border-radius: 24px; background: #000000; border: 3px solid #3A3F47; padding: 0; cursor: pointer"></button>
    </div>
  </div>
</nav>

<main style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 64px 72px 0 64px; box-sizing: border-box">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05">Logs</h1>
      <div style="font-size: 22px; color: #8A93A1">Service output · newest first</div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <button style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 26px; border-radius: 16px; border: 0; background: {{accent}}; color: #1A1405; font-family: 'Sora', sans-serif; font-size: 23px; font-weight: 700; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M4 19h16"></path></svg>
        <span>Export logs</span>
      </button>
      <button style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 26px; border-radius: 16px; border: 1px solid #2A313D; background: #1C212B; color: #F2F3F5; font-family: 'Sora', sans-serif; font-size: 23px; font-weight: 600; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"></path><path d="M20 4v5h-5"></path></svg>
        <span>Refresh</span>
      </button>
      <button style="height: 60px; padding: 0 26px; border-radius: 16px; border: 1px solid #2A313D; background: #1C212B; color: #F2F3F5; font-family: 'Sora', sans-serif; font-size: 23px; font-weight: 600; cursor: pointer">Clear</button>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 32px">
    <div role="group" aria-label="Filter by source" style="display: flex; gap: 10px">
      <button aria-pressed="true" style="height: 52px; padding: 0 24px; border-radius: 26px; border: 2px solid {{accent}}; background: #2A2208; color: #F2B544; font-family: 'Sora', sans-serif; font-size: 21px; font-weight: 700; cursor: pointer; box-shadow: {{ring}}">All</button>
      <button aria-pressed="false" style="height: 52px; padding: 0 24px; border-radius: 26px; border: 2px solid #2A313D; background: #151921; color: #DCE0E6; font-family: 'Sora', sans-serif; font-size: 21px; font-weight: 600; cursor: pointer">Service</button>
      <button aria-pressed="false" style="height: 52px; padding: 0 24px; border-radius: 26px; border: 2px solid #2A313D; background: #151921; color: #DCE0E6; font-family: 'Sora', sans-serif; font-size: 21px; font-weight: 600; cursor: pointer">Capture</button>
      <button aria-pressed="false" style="height: 52px; padding: 0 24px; border-radius: 26px; border: 2px solid #2A313D; background: #151921; color: #DCE0E6; font-family: 'Sora', sans-serif; font-size: 21px; font-weight: 600; cursor: pointer">Network</button>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="font-size: 21px; color: #DCE0E6">Warnings only</span>
      <button aria-label="Warnings only" aria-pressed="false" style="position: relative; width: 72px; height: 40px; border-radius: 20px; background: #2A3140; border: 0; padding: 0; cursor: pointer; flex-shrink: 0">
        <span style="position: absolute; top: 4px; left: 4px; width: 32px; height: 32px; border-radius: 16px; background: #C9D0DB"></span>
      </button>
    </div>
  </div>

  <section aria-label="Log entries" style="display: flex; flex-direction: column; margin-top: 24px; padding: 8px 12px; box-sizing: border-box; background: #12151B; border: 1px solid #1B2029; border-radius: 24px">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="12">
      <div style="display: flex; align-items: center; gap: 22px; height: 54px; padding: 0 14px; border-top: 1px solid #171C25">
        <span style="width: 110px; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #8A93A1">{{l.time}}</span>
        <span style="width: 78px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 30px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; color: {{l.levelColor}}; background: {{l.levelBg}}">{{l.level}}</span>
        <span style="width: 100px; flex-shrink: 0; font-size: 18px; color: #8A93A1">{{l.source}}</span>
        <span style="flex: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 21px; color: {{l.textColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.msg}}</span>
      </div>
    </sc-for>
  </section>

  <div style="margin-top: auto; height: 72px; border-top: 1px solid #1B2029; display: flex; align-items: center; gap: 20px; font-size: 20px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: 0.16em; color: #6F7886; font-weight: 600">LAST EVENT</span>
    <span style="color: #DCE0E6">Status info refreshed</span>
    <span style="flex: 1"></span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 19px; color: #8A93A1">18:41:02</span>
  </div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2B544","options":["#F2B544","#5CE0A1","#7FB4FF","#FF7B72"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F2B544';
    let h = accent.replace('#', '');
    if (h.length === 3) { h = h.split('').map((c) => c + c).join(''); }
    const n = parseInt(h, 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const glow = 'rgba(' + r + ',' + g + ',' + b + ',0.32)';
    const ring = '0 0 0 4px ' + accent + ', 0 0 0 10px ' + glow;
    const levels = {
      INFO: { levelColor: '#8FB8F5', levelBg: '#16243A', textColor: '#DCE0E6' },
      WARN: { levelColor: '#F2B544', levelBg: '#2A2208', textColor: '#F2F3F5' },
      ERROR: { levelColor: '#FF8B83', levelBg: '#3A1A18', textColor: '#F2F3F5' }
    };
    const raw = [
      ['18:41:02', 'INFO', 'service', 'Status info refreshed'],
      ['18:40:58', 'INFO', 'capture', 'Frame rate stable at 29.8 fps (target 30, vsync on)'],
      ['18:38:11', 'INFO', 'network', 'Connected to HyperHDR at 192.168.1.19:19400, priority 150'],
      ['18:38:10', 'INFO', 'capture', 'UI backend ready: libgm'],
      ['18:38:10', 'INFO', 'capture', 'Video backend ready: libvtcapture, 320x180, RGB'],
      ['18:38:09', 'INFO', 'service', 'Capture started (autostart)'],
      ['18:38:07', 'WARN', 'network', 'Receiver not reachable yet, retrying in 2 s'],
      ['18:38:05', 'INFO', 'service', 'Settings loaded'],
      ['18:38:04', 'INFO', 'service', 'PicCap service started, version 0.5.3'],
      ['18:38:03', 'INFO', 'service', 'TV booted, waiting for network'],
      ['16:02:40', 'ERROR', 'capture', 'Video backend libdile_vt failed to initialise, falling back'],
      ['16:02:39', 'INFO', 'service', 'Capture stopped by user']
    ];
    const lines = raw.map((x) => ({ time: x[0], level: x[1], source: x[2], msg: x[3], ...levels[x[1]] }));
    return { accent, glow, ring, lines };
  }
}
</script>
</body>
</html>
